services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: motocare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-motocare}
      POSTGRES_USER: ${DATABASE_USER:-motocare}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change-me-local-only}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - motocare-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  motocare-postgres-data:
