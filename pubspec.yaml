name: moto_care
description: "Moto Care Flutter application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  json_annotation: ^4.12.0
  socket_io_client: ^3.1.6
  geolocator: ^14.1.1
  image_picker: ^1.2.4
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  url_launcher: ^6.3.2
  font_awesome_flutter: ^11.0.0
  local_auth: ^3.0.2
  geocoding: ^5.0.0
  google_maps_flutter: ^2.18.2
  google_maps_flutter_ios_sdk9: ^2.19.0
  carousel_slider: ^5.1.2
  share_plus: ^13.3.1
  video_player: ^2.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  video_player_platform_interface: ^6.9.0
  flutter_native_splash: ^2.4.8
  image: ^4.10.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo-revo.png
    - assets/images/Background.png
    - assets/images/welcome-background.png
    - assets/images/weather-background.png
    - assets/images/rescue-tow.png
    - assets/images/rescue-team.png
    - assets/images/rescue-garage.png
    - assets/images/repair-shop-1.png
    - assets/images/repair-shop-2.png
    - assets/images/repair-shop-3.png
    - assets/images/repair-shop-4.png
    - assets/fonts/Montserrat_LICENSE.txt

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Montserrat-BoldItalic.ttf
          weight: 700
          style: italic
