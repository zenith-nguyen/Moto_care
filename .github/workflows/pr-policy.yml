name: PR Policy

on:
  pull_request:
    branches: [main, cam-thu, thanh-vy]
    types: [opened, reopened, edited, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  branch-policy:
    name: branch-policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate source and target branches
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          case "$BASE_BRANCH" in
            cam-thu)
              PATTERN='^(feat|fix|docs|refactor|test|chore)/cam-thu/[a-z0-9][a-z0-9-]*$'
              ;;
            thanh-vy)
              PATTERN='^(feat|fix|docs|refactor|test|chore)/thanh-vy/[a-z0-9][a-z0-9-]*$'
              ;;
            main)
              PATTERN='^(cam-thu|thanh-vy|hotfix/[a-z0-9][a-z0-9-]*)$'
              ;;
            *)
              echo "Unsupported target branch: $BASE_BRANCH"
              exit 1
              ;;
          esac

          if [[ ! "$HEAD_BRANCH" =~ $PATTERN ]]; then
            echo "PR from '$HEAD_BRANCH' to '$BASE_BRANCH' violates the branch policy."
            exit 1
          fi

          echo "Branch policy passed: $HEAD_BRANCH -> $BASE_BRANCH"
