name: Flutter CI

on:
  pull_request:
    branches: [main, cam-thu, thanh-vy]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main, cam-thu, thanh-vy]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Flutter CI / quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify repository integration guardrails
        shell: bash
        run: |
          required_files=(
            ".github/CODEOWNERS"
            ".github/PULL_REQUEST_TEMPLATE.md"
            ".github/workflows/backend-ci.yml"
            ".github/workflows/ci.yml"
            ".github/workflows/pr-policy.yml"
            ".github/workflows/release-android.yml"
            "AGENTS.md"
            "CONTRIBUTING.md"
            "backend/docs/API_CATALOG.md"
            "backend/docs/PROGRESS.md"
            "docs/README.md"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Required repository file was removed: $file"
              exit 1
            fi
          done

          forbidden_files="$(git ls-files | grep -E '(^|/)\.vscode/|(^|/)\.flutter-plugins-dependencies( |$)|(^|/)android/\.kotlin/|(^|/)ios/Flutter/(Generated\.xcconfig|flutter_export_environment\.sh)$' || true)"
          if [[ -n "$forbidden_files" ]]; then
            echo "Generated or machine-local files must not be committed:"
            echo "$forbidden_files"
            exit 1
          fi

          grep -q "MotoCareApp" lib/main.dart || {
            echo "lib/main.dart must preserve the shared Customer runtime; add role entrypoints separately."
            exit 1
          }

          for dependency in flutter_riverpod go_router dio flutter_secure_storage socket_io_client; do
            grep -Eq "^[[:space:]]+$dependency:" pubspec.yaml || {
              echo "Shared runtime dependency was removed from pubspec.yaml: $dependency"
              exit 1
            }
          done

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Customer Android debug APK
        run: flutter build apk --debug --flavor customer -t lib/main.dart

      - name: Build Provider Android debug APK
        run: flutter build apk --debug --flavor provider -t lib/main_provider.dart
